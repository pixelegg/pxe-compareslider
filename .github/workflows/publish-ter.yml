# Publishes a tagged release to the TYPO3 Extension Repository (TER).
#
# One-time setup in the GitHub repository:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   TYPO3_API_TOKEN = access token from https://extensions.typo3.org/my-access-tokens
#   (scope "extension:write", created by the account that owns the extension key).
#
# Release: bump "version" in ext_emconf.php and add a CHANGELOG entry, then
#   git tag v2.2.0 && git push origin v2.2.0
# The tag (without "v") must equal the version in ext_emconf.php.
name: Publish to TER

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Upload ${{ github.ref_name }} to TER
    runs-on: ubuntu-latest
    if: github.repository == 'pixelegg/pxe-compareslider'
    env:
      TYPO3_EXTENSION_KEY: pxe_compareslider
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, zip
          coverage: none

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EMCONF_VERSION=$(php -r '$_EXTKEY = "pxe_compareslider"; include "ext_emconf.php"; echo $EM_CONF[$_EXTKEY]["version"];')
          if [ "$VERSION" != "$EMCONF_VERSION" ]; then
            echo "Tag $VERSION does not match ext_emconf.php version $EMCONF_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for TER token
        id: token
        run: |
          if [ -z "$TYPO3_API_TOKEN" ]; then
            echo "::warning::Secret TYPO3_API_TOKEN is not set – skipping the TER upload."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install typo3/tailor
        if: steps.token.outputs.present == 'true'
        run: composer global require typo3/tailor --no-interaction --no-progress

      - name: Publish to TER
        if: steps.token.outputs.present == 'true'
        run: |
          COMMENT="$(sed -n '/^## \['"${{ steps.version.outputs.version }}"'\]/,/^## \[/p' CHANGELOG.md | sed '1d;$d' | head -c 1800)"
          [ -n "$COMMENT" ] || COMMENT="Release ${{ steps.version.outputs.version }}"
          ~/.composer/vendor/bin/tailor ter:publish --comment "$COMMENT" "${{ steps.version.outputs.version }}"
